basePath: /
definitions:
  main.CreatePaymentRequest:
    properties:
      amount:
        type: number
      orderId:
        type: string
      paymentMethod:
        type: string
    required:
    - amount
    - orderId
    - paymentMethod
    type: object
  main.WebhookPaymentRequest:
    properties:
      paymentId:
        type: string
      status:
        enum:
        - SUCCESS
        - FAILED
        type: string
      transactionId:
        type: string
    required:
    - paymentId
    - status
    - transactionId
    type: object
  models.Payment:
    properties:
      amount:
        type: number
      createdAt:
        type: string
      id:
        type: string
      orderId:
        type: string
      paymentMethod:
        type: string
      status:
        $ref: '#/definitions/models.PaymentStatus'
      transactionId:
        type: string
      updatedAt:
        type: string
    type: object
  models.PaymentStatus:
    enum:
    - PENDING
    - SUCCESS
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusSuccess
    - StatusFailed
host: localhost:8083
info:
  contact: {}
  description: REST API for Papiton Express Payment Service (Milestone 1)
  title: Papiton Express - Payment Service API
  version: "1.0"
paths:
  /payments:
    post:
      consumes:
      - application/json
      description: Create a new billing invoice in PENDING status
      parameters:
      - description: Create Invoice Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CreatePaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Payment'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new payment invoice
      tags:
      - payments
  /payments/{id}:
    get:
      description: Retrieve a single payment record by its ID
      parameters:
      - description: Payment UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Payment'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get payment status by ID
      tags:
      - payments
  /payments/webhook:
    post:
      consumes:
      - application/json
      description: Webhook from third-party payment gateway to update payment status
        and record outbox event
      parameters:
      - description: Webhook Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.WebhookPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Process payment webhook callback
      tags:
      - payments
swagger: "2.0"
