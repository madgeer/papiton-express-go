version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: papiton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - papiton-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: papiton-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LIVENESS_PROBE_INTERVAL_MS: 1000
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - papiton-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: papiton-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    networks:
      - papiton-network

  # ---------------------------------------------
  # Papiton Backend Microservices (REST APIs)
  # ---------------------------------------------
  order-service:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: papiton-order-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=papiton_order
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - PORT=8081
    depends_on:
      - postgres
    networks:
      - papiton-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: papiton-auth-service
    ports:
      - "8082:8082"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=papiton_auth
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - PORT=8082
    depends_on:
      - postgres
    networks:
      - papiton-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: papiton-payment-service
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=papiton_payment
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - PORT=8083
    depends_on:
      - postgres
    networks:
      - papiton-network

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping/Dockerfile
    container_name: papiton-shipping-service
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=papiton_shipping
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - PORT=8084
    depends_on:
      - postgres
    networks:
      - papiton-network

  warehouse-service:
    build:
      context: .
      dockerfile: services/warehouse/Dockerfile
    container_name: papiton-warehouse-service
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=papiton_warehouse
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - PORT=8085
    depends_on:
      - postgres
    networks:
      - papiton-network

  tracking-service:
    build:
      context: .
      dockerfile: services/tracking/Dockerfile
    container_name: papiton-tracking-service
    ports:
      - "8086:8086"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=papiton_tracking
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - PORT=8086
    depends_on:
      - postgres
    networks:
      - papiton-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: papiton-notification-service
    ports:
      - "8087:8087"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=papiton_notification
      - DB_SSLMODE=disable
      - DB_TIMEZONE=Asia/Jakarta
      - PORT=8087
    depends_on:
      - postgres
    networks:
      - papiton-network

  # ---------------------------------------------
  # Papiton Frontend UI (React + Vite)
  # ---------------------------------------------
  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: papiton-frontend
    ports:
      - "5173:5173"
    depends_on:
      - auth-service
      - order-service
      - payment-service
      - shipping-service
      - warehouse-service
      - tracking-service
      - notification-service
    networks:
      - papiton-network

volumes:
  postgres_data:

networks:
  papiton-network:
    driver: bridge